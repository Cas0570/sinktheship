name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - name: Verify source and format
        run: pnpm format:check
      - name: Compile project references
        run: pnpm typecheck
      - name: Lint and check boundaries
        run: |
          mkdir -p .artifacts
          pnpm lint 2>&1 | tee .artifacts/lint.log
      - name: Run tooling and boundary tests
        run: pnpm test 2>&1 | tee .artifacts/tests.log
      - name: Upload diagnostic reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-ts-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
